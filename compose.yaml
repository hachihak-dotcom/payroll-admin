services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll_local
      POSTGRES_DB: payroll
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - payroll_db:/var/lib/postgresql/data
volumes:
  payroll_db:
